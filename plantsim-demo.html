function map(data,title='场地植物分布'){const colors={normal:'#a4d4c5',watch:'#f59e0b',medium:'#e8b94a',high:'#ff6b5a'},w=760/U.zoom,h=400/U.zoom,x=(760-w)/2+U.panX,y=(400-h)/2+U.panY;return `<div class="map"><svg viewBox="${x} ${y} ${w} ${h}" role="group" aria-label="${esc(title)}"><rect width="760" height="400" fill="#dbeae3"/><path d="M0 305Q200 280 390 320T760 290V400H0Z" fill="#8fcbd5"/><path d="M15 125H740M15 210H740" stroke="#fffaf0" stroke-width="22"/><g font-size="12" fill="#1a3a3a"><text x="20" y="35">入口区</text><text x="20" y="145">步道区</text><text x="20" y="225">休息区</text><text x="20" y="305">滨水区</text></g>${data.map(p=>`<g role="button" tabindex="0" aria-label="${p.id} ${esc(p.name)} ${riskLabel(p.risk||'normal')}" data-act="plant" data-plant="${p.id}"><title>${esc(p.name)} · ${p.quantity} · ${riskLabel(p.risk||'normal')}</title><circle cx="${p.x}" cy="${p.y}" r="${U.plant===p.id?17:13}" fill="${colors[p.risk||'normal']}" stroke="${U.plant===p.id?'#1a3a3a':'#fff'}" stroke-width="3"/><text x="${p.x}" y="${p.y+28}" text-anchor="middle" font-size="12" fill="#1a3a3a">${p.id}</text></g>`).join('')}</svg></div>`;}

function home(){const completed=P.runs.filter(r=>r.status==='complete'&&!r.replayOf),stats=[['teal','项目总数','1'],['peach','模拟运行',P.runs.length],['lav','设计版本',P.versions.length],['ochre','风险事件',completed.reduce((n,r)=>n+r.paths.reduce((a,p)=>a+p.history.reduce((a,h)=>a+h.events.length,0),0),0)],['cream','采纳方案',P.adoption?1:0],['pink','已恢复异常',P.runs.reduce((n,r)=>n+r.failures.filter(f=>f.status==='RECOVERED').length,0)]];return `<div class="hero"><div><div class="eyebrow">植物未来模拟与方案评测平台</div><h1>让植物方案，<br>先经历未来。</h1><p class="lead">把设计目标转成有决策价值的未来情景。让受控 Agent 连续模拟，找出长期风险，再验证每一次修改。</p><div class="hero-buttons">${btn('新建项目','new-project','',true)}${btn('继续演示项目 →','nav','data-page="1"')}</div></div>${scene()}</div><section class="section"><div class="section-head"><div><div class="eyebrow">当前会话 · 实际记录</div><h2>从运行，到决策</h2></div><p>刷新后重新开始</p></div><div class="grid">${stats.map((s,i)=>`<button class="feature ${s[0]}" data-act="stat" data-index="${i}"><span>${s[1]}</span><div class="metric">${s[2]}</div><div class="mini">展开趋势与统计口径 ↗</div></button>`).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">项目工作区</div><h2>继续你的评测</h2></div></div><div class="grid"><article class="project active">${badge(version().status)}<h3 style="margin-top:16px">${esc(P.name)}</h3><p>${esc(P.climate)} · ${P.area}公顷</p><div class="meta"><span>20 株/株群</span><span>${P.versions.length}个设计版本</span><span>${new Date(version().createdAt).toLocaleDateString('zh-CN')}</span><span>${completed.length}次完成</span></div>${btn('打开项目 →','nav','data-page="1"')}</article><article class="project"><h3>本次业务闭环</h3><p>设计师确认基线与方案；植物专家解释风险；甲方权衡收益与成本。</p><div class="mini">当前：${names[Math.max(1,U.page)]}<br>最终采纳：${P.adoption?esc(P.adoption.versionId):'待专家评审'}</div>${btn('查看决策记录','nav','data-page="7"')}</article><button class="project new" data-act="new-project"><div class="metric">＋</div><h3>新建项目</h3><p>导入 CAD、GIS、表格、需求和照片</p></button></div></section><section class="section"><div class="section-head"><h2>完整设计验证闭环</h2></div><div class="grid">${[['pink','异构资料','输入冲突 → 标准基线',1],['teal','未来蓝图','目标 → 6张冻结任务卡',3],['lav','连续模拟','并行路径 · 顺序周期',4],['peach','风险定位','条件 → Effect → 状态',5],['ochre','方案比较','同条件 · 最多3版',6],['cream','运行追溯','Checkpoint → 局部恢复',7]].map(s=>`<button class="feature ${s[0]}" data-act="nav" data-page="${s[3]}"><h3>${s[1]}</h3><p>${s[2]}</p><div class="mini">确定性 Workflow + 受控 Agent</div></button>`).join('')}</div></section><div class="footer-scene"><div class="footer-copy"><div class="eyebrow">PlantSim</div><h2 style="font-size:36px">把风险留在模拟里。</h2>${btn('进入项目','nav','data-page="1"',true)}</div><div class="sun"></div><div class="hill a"></div><div class="hill b"></div><div class="tree" style="left:73%;bottom:0"><div class="crown"></div><div class="trunk"></div></div></div>`;}
function baseline(){const v=version(),b=v.baseline;return `${header('项目方案','资料、标准基线与设计版本集中管理。')}<div class="layout"><aside class="side"><div class="eyebrow">设计版本 · 不覆盖历史</div>${P.versions.map(v=>`<button data-act="version" data-version="${v.id}" class="${v.id===U.version?'active':''}"><b>${v.id}</b> ${esc(v.note)}<small style="display:block">${v.status} · ${new Date(v.createdAt).toLocaleDateString('zh-CN')}</small></button>`).join('')}${btn('＋ 修改方案','modify','',false)}</aside><div><div class="card"><h3>${esc(P.name)}</h3><p>${esc(P.location)} · ${P.area}公顷</p><div class="flow">${['上传资料','解析字段','冲突确认','基线生成'].map((x,i)=>`<div class="${P.stage>i?'done':'current'}"><b>0${i+1} ${x}</b></div>`).join('')}</div><details open><summary>01–02 资料导入与解析</summary><p class="tiny">文件仅取名称用于演示；不会读取内容或上传。CAD/GIS/Excel/DOCX/照片由内置样例解析。</p><label for="files">选择本地演示文件（可多选）</label><input type="file" id="files" multiple accept=".dwg,.dxf,.geojson,.json,.xlsx,.csv,.docx,.jpg,.png" ${b.confirmed?'disabled':''}><p>${btn('导入内置案例资料','import',b.confirmed?'disabled':'',true)}</p>${P.imports.map(f=>`<p>${badge('已解析','normal')} ${esc(f.name)} · ${f.fields}字段 · ${f.parser}</p>`).join('')}</details><details open><summary>03 跨文件冲突与来源</summary><p>A01：Excel记录3株，CAD识别2点+1个低置信候选。必须显式复核。</p>${b.conflicts[0].resolved?badge('已采用 '+b.conflicts[0].chosen+' 株','normal'):btn('处理数量冲突','conflict',!P.imports.length?'disabled':'',true)}</details><details open><summary>04 Input Gate</summary><p>${b.confirmed?'已确认；修改需创建新版本。':'校验全部资料与冲突后形成可运行基线。'}</p>${btn('确认当前基线','confirm-baseline',b.confirmed?'disabled':'',true)}</details></div><section class="section"><div class="section-head"><div><h2>植物清单</h2><p>4区域 × 5个记录 · 来源可核查</p></div>${btn('修改方案','modify')}</div><div class="table-wrap"><table class="table"><thead><tr><th>区域 / 编号</th><th>植物 / 学名</th><th>数量 / 规格</th><th>来源与置信度</th><th>状态</th></tr></thead><tbody>${b.plants.map(p=>`<tr class="${p.source.confidence<.9?'warn-row':''}"><td>${p.area}<small>${p.id}</small></td><td>${esc(p.name)}<small>${esc(p.latin)}</small>${p.companion?'<small>增补 '+esc(p.companion)+'</small>':''}</td><td>${p.quantity}${p.spec.includes('m²')?' m²':''}<small>${p.spec}${p.drip?' · 滴灌':''}${p.rootProtection?' · 根系保护':''}</small></td><td>${esc(p.source.file)} 第${p.source.row}行<small>${p.source.photo} · ${Math.round(p.source.confidence*100)}%</small></td><td>${p.id==='A01'&&!b.conflicts[0].resolved?'待复核':p.source.confidence<.9?'低置信提示':'已识别'}</td></tr>`).join('')}</tbody></table></div></section><section class="section"><h2>设计场地平面图</h2>${map(b.plants)}<p class="tiny">点位为演示坐标；点击植物查看来源、数量与版本属性。</p></section><p>${btn('设置模拟目标 →','nav',`data-page="2" ${b.confirmed?'':'disabled'}`,true)}</p></div></div>`;}
function goal(){if(!version().baseline.confirmed)return empty('先完成资料与基线',1,'返回基线');const d=U.goalDraft;return `${header('模拟目标','自然语言解析与结构化修订；每次保存生成独立版本。')}<div class="split"><div><div class="card">${area('业务目标','goalText',U.goalText)}${btn('结构化目标','parse-goal','',true)}</div><div class="card" style="margin-top:20px"><h3>${d?'结构化草稿':'等待解析'}</h3>${d?`${field('模拟周期（月）','goalHorizon',d.horizon,'number','min="1" max="60"')}${field('关注指标（逗号分隔，可增删）','goalFocus',d.focus.join('，'))}${field('重点风险（逗号分隔，可增删）','goalRisks',d.risks.join('，'))}${field('遮阴下限（%）','goalShade',d.shade,'number','min="0" max="100"')}${area('约束','goalConstraints',d.constraints)}${btn('确认并保存新目标版本','save-goal','',true)}`:'<p>提取时间、关注对象、风险因素和约束。</p>'}</div><details class="card" style="margin-top:20px" open><summary>已保存目标（${P.goals.length}）</summary>${P.goals.map(g=>`<details><summary>${g.id} · ${g.horizon}个月 · ${esc(g.focus.join('、'))}</summary>${json(g)}${btn('基于此版修订','load-goal',`data-goal="${g.id}"`)}</details>`).join('')||'<p>尚未保存</p>'}</details><p>${btn('未来蓝图 →','nav',`data-page="3" ${P.goals.length?'':'disabled'}`,true)}</p></div>${conversation('goal')}</div>`;}
function blueprints(){if(!P.goals.length)return empty('先确认模拟目标',2,'设置目标');const c=P.cards.find(c=>c.pathId===U.path);return `${header('未来蓝图','3种蓝图、6条未来路径；修改任务卡后重新校验与冻结。')}<div class="grid">${[['lav','A','基准未来'],['peach','B','高温未来'],['cream','C','复合极端']].map(x=>`<article class="feature ${x[0]} blueprint"><div class="eyebrow">Blueprint ${x[1]}</div><h3>${x[2]}</h3><details open><summary>展开路径与环境条件</summary>${E.PATHS.filter(p=>p.id[0]===x[1]).map(p=>`<p><button class="btn small" data-act="path" data-path="${p.id}">${p.id} ${p.name}</button><br><small>${p.conditions}</small></p>`).join('')}</details></article>`).join('')}</div><section class="section grid two"><div class="path-tree"><h3>蓝图 → 路径 → 任务卡</h3>${['A','B','C'].map(x=>`<details open><summary>Blueprint ${x}</summary><ul>${P.cards.filter(c=>c.pathId[0]===x).map(c=>`<li>${c.pathId} → ${c.id} ${badge(c.frozen?'冻结':c.gate?.passed?'校验通过':'待校验',c.frozen?'normal':'watch')}</li>`).join('')}</ul></details>`).join('')}</div><div class="card"><h3>因素因果关系</h3><details open><summary>气候影响</summary><div class="factor-net"><span class="factor">高温 / 少雨</span>→<span class="factor">水分压力</span>→<span class="factor">健康与冠幅</span></div></details><details><summary>空间与人流影响</summary><p>高人流 → 土壤压实 → 根系受损；保护槽与围栏可降低暴露。</p></details><p class="tiny">Agent只读当前上下文；不访问其他路径的状态。</p></div></section><section class="section"><div class="section-head"><h2>WorldTaskCard</h2>${badge(P.cards.filter(c=>c.frozen).length+'/6 已冻结','normal')}</div>${pathTabs()}<div class="card"><fieldset ${c.frozen?'disabled':''}><legend>${c.id} · revision ${c.revision}</legend><div class="grid two">${field('simulation_horizon（月）','task-horizon',c.horizon,'number','min="1" max="60"')}${field('world_conditions','task-conditions',c.conditions)}${field('active_factors','task-activeFactors',c.activeFactors)}${field('risk_context','task-riskContext',c.riskContext)}${field('maintenance','task-maintenance',c.maintenance)}${field('timeline','task-timeline',c.timeline)}${field('simulation_focus','task-focus',c.focus)}${field('constraints','task-constraints',c.constraints)}</div></fieldset><p>${c.gate?badge(c.gate.passed?'Gate通过':'Gate失败',c.gate.passed?'normal':'high'):'编辑将使旧校验失效'}</p><div class="button-row">${btn('保存并校验当前卡','validate-card',c.frozen?'disabled':'')}${btn(c.frozen?'解冻当前卡':'冻结当前卡',c.frozen?'unfreeze':'freeze','',true)}${btn('校验并冻结全部','freeze-all')}${btn('创建模拟 →','create-run',P.cards.every(c=>c.frozen)?'':'disabled',true)}</div></div></section>`;}
function running(){const r=run();if(!r)return `${header('模拟运行','运行尚未创建。')}${empty('先冻结全部任务卡',3,'返回未来蓝图')}`;const p=pathState(),h=record(),count=r.paths.reduce((n,p)=>n+p.cycle,0),total=r.paths.reduce((n,p)=>n+p.horizon,0);return `${header(r.replayOf?'Checkpoint 回放':'模拟运行','并行路径、顺序周期；失败只回退局部节点。')}<div class="run-layout"><aside class="path-list">${r.paths.map(p=>`<button class="path-item ${U.path===p.id?'active':''}" data-act="path" data-path="${p.id}" style="width:100%;border:0;text-align:left"><b>Path ${p.id} · ${p.cycle}/${p.horizon}</b><div class="progress"><span style="width:${p.cycle/p.horizon*100}%"></span></div><small>${p.blocked?'⚠ Gate等待处理':p.cycle===p.horizon?'已完成':'顺序推进'}</small></button>`).join('')}</aside><div><div class="grid four"><div class="card"><span class="tiny">Run</span><h3>${r.id}</h3><small>${r.versionId}</small></div><div class="card"><span class="tiny">已提交周期</span><div class="metric">${count}<small>/${total}</small></div></div><div class="card"><span class="tiny">状态</span><h3>${r.status.toUpperCase()}</h3></div><div class="card"><span class="tiny">恢复事件</span><div class="metric">${r.failures.filter(f=>f.status==='RECOVERED').length}</div></div></div><div class="card" style="margin-top:20px"><h3>Path ${p.id} · Cycle ${h?.cycle||1}</h3><div class="timeline">${Array.from({length:p.horizon},(_,i)=>`<button class="cycle ${i<p.cycle?'done':''} ${r.failures.some(f=>f.pathId===p.id&&f.cycle===i+1)?'risk':''}" data-act="cycle" data-cycle="${i+1}" ${i>=p.cycle?'disabled':''} aria-label="查看周期${i+1}">${i+1}</button>`).join('')}</div><div class="agents">${['Plant','Stress','Human'].map(a=>`<button class="agent" data-act="node" data-node="${a}"><b>${a} Agent</b><br><small>并行生成 ${h?h.effects.filter(e=>e.agent===a).length:'待生成'} 个Effect</small></button>`).join('')}</div><div class="resolver"><b>Barrier → Intermediate Resolver</b><br>Maintenance → Final Resolver → State(t+1)</div><p class="tiny">本周期已结算 ${h?.changes.length||0} 条变更；模型从未直接修改植物状态。</p>${btn('下钻当前周期证据','trace','',false)}</div><div class="button-row" style="margin:20px 0">${btn(r.status==='paused'?'继续运行':'开始运行','start',r.status==='complete'?'disabled':'',true)}${btn('暂停','pause',!timer?'disabled':'')}${btn('快进（仍执行全部周期）','fast',r.status==='complete'?'disabled':'')}${btn('处理待恢复 Gate','pending-gate',r.failures.some(f=>f.status==='FAILED')?'':'disabled')}</div><div class="events" aria-label="事件流">${r.logs.slice(-12).reverse().map(e=>`<div class="event ${e.type==='ToolRetry'?'quiet':e.type==='FailureEvent'?'warn':''}">${e.pathId} / C${e.cycle} · ${esc(e.text)}</div>`).join('')||'<p>点击开始运行。</p>'}</div><p>${btn('查看结果 →','nav',`data-page="5" ${r.status==='complete'?'':'disabled'}`,true)}</p></div></div>`;}
function curve(p){const rs=p.history,pts=rs.map((h,i)=>`${35+i/Math.max(1,rs.length-1)*640},${180-h.state.find(x=>x.id===U.plant).health*1.4}`).join(' ');return `<svg viewBox="0 0 720 220" role="img" aria-label="${U.plant}健康指数，0至100，按模拟月份"><path d="M35 30V180H680" stroke="#6a6a6a" fill="none"/><path d="M35 138H680M35 96H680" stroke="#ddd" stroke-dasharray="4"/><polyline points="${pts}" fill="none" stroke="#1a3a3a" stroke-width="3"/><g font-size="12" fill="#3a3a3a"><text x="5" y="42">100</text><text x="15" y="180">0</text><text x="35" y="205">C1</text><text x="630" y="205">C${p.cycle}</text><text x="280" y="205">健康指数 · ${U.plant}</text></g></svg>`;}
function cause(h,plant,technical=true){const es=h.effects.filter(e=>e.target===plant&&e.delta!==0),s=h.state.find(x=>x.id===plant),i=h.input.find(x=>x.id===plant),mid=h.intermediate.find(x=>x.id===plant);return `<div class="chain"><div><b>未来条件</b> · ${esc(E.PATHS.find(x=>x.id===h.pathId).conditions)}</div><div><b>Agent Effect</b> · ${[...new Set(es.map(e=>technical?e.agent+' / '+e.tool:e.agent))].join('，')}${technical?`<details><summary>${es.length}条影响证据</summary>${json(es)}</details>`:''}</div><div><b>状态结算</b> · 健康 ${i.health.toFixed(1)} → ${mid.health.toFixed(1)} → ${s.health.toFixed(1)}<br>初始 → 胁迫后 → 养护后</div><div><b>结果</b> · ${riskLabel(s.risk)}；冠幅 ${s.crown.toFixed(2)}m</div></div>${btn('定位完整 Trace','evidence',`data-path="${h.pathId}" data-cycle="${h.cycle}" data-plant="${plant}"`)}`;}
function results(){const r=run();if(!r||r.status!=='complete')return empty('模拟完成后才能查看结果',4,'返回运行');const p=pathState(),h=record(),s=h.state.find(x=>x.id===U.plant)||h.state[0];let body='';if(U.tab==='map')body=`<div class="split"><div>${mapControls()}${map(h.state)}<div class="legend">${['normal','watch','medium','high'].map(x=>badge(riskLabel(x),x)).join(' ')}</div></div><div>${badge(riskLabel(s.risk),s.risk)}<h2 style="font-size:32px;margin-top:15px">${s.id} ${esc(s.name)}</h2><dl class="kv"><dt>路径 / 周期</dt><dd>${p.id} / C${h.cycle}</dd><dt>健康指数</dt><dd>${s.health.toFixed(1)} / 100</dd><dt>冠幅</dt><dd>${s.crown.toFixed(2)}m</dd><dt>数量</dt><dd>${s.quantity}</dd></dl><details><summary>展开当前状态原因链</summary>${cause(h,s.id)}</details></div></div><div class="card" style="margin-top:20px">${curve(p)}</div>`;

function comparison(){const completed=P.versions.filter(v=>E.latestRun(P,v.id));U.selected=U.selected.filter(id=>completed.some(v=>v.id===id));if(U.selected.length<2&&completed.length>=2)U.selected=completed.slice(-3).map(v=>v.id);let rows=[],error='';if(U.selected.length>=2)try{rows=E.compare(U.selected.map(id=>E.latestRun(P,id)));}catch(e){error=e.message;}const sort=DIM.find(d=>d[0]===U.sort)||DIM[1];rows.sort((a,b)=>(b[sort[0]]-a[sort[0]])*sort[3]);return `${header('方案比较','相同未来路径、目标、规则和seed；保留多维取舍，不强行给出唯一最优。')}<div class="card"><h3>VersionSelector · ${U.selected.length}/3</h3><p>至少2个、最多3个已完成版本。未运行版本不能比较。</p><div class="versions">${P.versions.map(v=>{const ready=!!E.latestRun(P,v.id);return `<label class="version ${U.selected.includes(v.id)?'selected':''}"><input type="checkbox" data-compare="${v.id}" ${U.selected.includes(v.id)?'checked':''} ${!ready||U.selected.length===3&&!U.selected.includes(v.id)?'disabled':''}><span><b>${v.id} · ${esc(v.note)}</b><small style="display:block">${ready?'已完成完整模拟':'待确认 / 待重跑'}</small></span></label>`;}).join('')}</div></div>${!rows.length?`<div class="card empty"><h3>${error||'完成至少两个设计版本后比较'}</h3><p>从V1风险创建V2，确认基线后，在相同未来条件下重跑。</p>${btn('修改方案','modify','',true)} ${btn('当前版本重跑','rerun')}</div>`:`<section class="section"><div class="section-head"><div><h2>多维比较矩阵</h2><p>绿色为本次选中版本的最佳值；成本越低越好。点击指标排序版本。</p></div>${badge('公平性签名一致','normal')}</div><div class="table-wrap"><table class="comparison"><thead><tr><th>指标 / 排序</th>${rows.map(r=>`<th>${r.versionId}</th>`).join('')}</tr></thead><tbody>${DIM.map(d=>{const vals=rows.map(r=>r[d[0]]),best=d[3]>0?Math.max(...vals):Math.min(...vals),worst=d[3]>0?Math.min(...vals):Math.max(...vals);return `<tr><td><button class="btn text small" data-act="sort" data-sort="${d[0]}">${d[1]} ↕</button></td>${rows.map(r=>`<td class="${r[d[0]]===best?'best':r[d[0]]===worst?'worst':''}">${r[d[0]].toLocaleString()} ${d[2]}</td>`).join('')}</tr>`;}).join('')}</tbody></table></div><p class="tiny">来源：当前运行的状态与养护记录聚合；不是产品规划中的静态示例结果。冠幅/健康按路径和植物记录等权平均，高风险按历史中不同植物编号去重。高温表现取B1/B2末期平均健康；雨水指数为基础50+滴灌设施25（演示标尺）。</p></section><section class="section"><h2>相同空间，比较风险</h2>${pathTabs()}${mapControls()}<div class="maps" style="grid-template-columns:repeat(${rows.length},minmax(0,1fr))">${rows.map(row=>{const r=P.runs.find(r=>r.id===row.runId),p=pathState(r);return `<div class="mini-map"><h3>${row.versionId} / ${p.id} / C${p.cycle}</h3>${map(p.state)}</div>`;}).join('')}</div></section><section class="section grid two"><div class="card"><h3>归一化表现 · 越长越优</h3><div class="legend">${rows.map((r,i)=>`<span style="color:${['#9e3a32','#6c4a91','#1a3a3a'][i]}">● ${r.versionId}</span>`).join(' ')}</div><div class="bars">${DIM.filter(d=>['health','highRisk','care','total','shade'].includes(d[0])).map(d=>`<div class="bar-row"><span>${d[1]}</span><div class="bar-lines">${rows.map((r,i)=>{const score=Math.max(0,Math.min(100,d[3]>0?r[d[0]]/d[4]*100:100-r[d[0]]/d[4]*100));return `<div title="${r.versionId}: ${score.toFixed(1)}/100" class="bar" style="width:${score}%;background:${['#9e3a32','#6c4a91','#1a3a3a'][i]}"></div>`;}).join('')}</div></div>`).join('')}</div><p class="tiny">固定标尺：健康/遮阴100；高风险5个；养护20次；总成本10万元。逆向指标按1−数值/标尺归一化。</p></div><div class="feature peach"><h3>预计返工与成本取舍</h3><details open><summary>展开计算口径</summary><p>曾出现高风险的不同记录 × ¥4,000 + 末期中风险不同记录 × ¥1,000。</p>${rows.map(r=>`<p>${r.versionId}：建设¥${r.construction.toLocaleString()} + 返工¥${r.rework.toLocaleString()} = ¥${r.total.toLocaleString()}</p>`).join('')}<p class="tiny">为演示单位成本，不是报价；新增设施计入建设成本。</p></details></div></section><div class="card" style="margin-top:24px"><h3>由专家与甲方完成取舍</h3><label for="adoptVersion">采纳版本</label><select id="adoptVersion">${rows.map(r=>`<option>${r.versionId}</option>`).join('')}</select>${area('采纳理由与保留风险','adoptNote','综合遮阴、长期健康、养护与建设成本；仍需现场复核物种适应性及极端天气风险。')}${btn('记录采纳并生成摘要','adopt','',true)}</div>`}<div class="button-row">${btn('修改方案','modify')}${btn('当前版本同条件重跑','rerun')}${btn('运行记录','nav','data-page="7"')}</div>`;}
function traceView(){if(!P.runs.length)return empty('还没有运行记录',3,'创建模拟');const r=run()||P.runs.at(-1);if(!run())U.runId=r.id;const p=pathState(r),h=record(r),failure=r.failures.find(f=>f.pathId===p.id&&f.cycle===(h?.cycle||U.cycle));const nodes=['Plant','Stress','Human','Tool','Effect','Intermediate','Maintenance','State','Gate','Retry','Checkpoint','Prompt'];let detail='';if(!h)detail='<p>该路径暂无已提交周期，开始模拟或处理 Gate 后即可取证。</p>';else if(U.mode==='business')detail=`<h2 style="font-size:32px">${U.plant} · C${h.cycle} 的变化</h2>${cause(h,U.plant,false)}`;else{const es=h.effects.filter(e=>e.agent===U.node),nodeData=U.node==='Effect'?h.effects:U.node==='State'?h.changes:U.node==='Intermediate'?h.intermediate:U.node==='Maintenance'?{decisions:h.care,effects:h.maintenance}:U.node==='Gate'?{checks:h.gates,failure}:U.node==='Retry'?failure||'本周期无需重试':U.node==='Checkpoint'?{input:h.checkpoint.input,cycle:h.cycle,node:failure?.node||'cycle-start',id:failure?.checkpointId||r.id+'/'+p.id+'/C'+h.cycle}:U.node==='Tool'?r.logs.filter(e=>e.pathId===p.id&&e.cycle===h.cycle):U.node==='Prompt'?{system:'你是受控植物模拟Agent。只能读取ContextPack，只能输出EffectPackage。禁止修改State或读取其他路径。',context:{path:p.id,cycle:h.cycle,taskCard:r.cards.find(c=>c.pathId===p.id),plant:U.plant},outputSchema:{target:'plant id',field:'health|crown|spacing',delta:'finite number'}}:{input:h.input.filter(x=>x.id===U.plant),effects:es.filter(x=>x.target===U.plant)};detail=`${badge(U.node,'dark')}<h2 style="font-size:32px;margin-top:16px">${p.id} / C${h.cycle} / ${U.plant}</h2><details open><summary>完整输入 / 输出证据</summary>${json(nodeData)}</details><div class="button-row">${btn('从该周期Checkpoint重放','replay','',true)}${btn('标记 Bad Case','bad')}</div>`;}

>${f.pathId} / C${f.cycle} · ${f.type}</b><p>${f.description} · ${f.status} · Retry ${f.retry}/2</p>${btn('定位事件','failure-trace',`data-failure="${f.id}"`)}</article>`).join('')}</details>${P.adoption?summary():''}`;}

function createRun(){stop();const ref=P.runs.find(r=>r.versionId!==U.version&&r.status==='complete'&&!r.replayOf),r=E.newRun(P,version(),ref);U.runId=r.id;U.path='B1';U.cycle=1;U.page=4;render();toast(ref?'新运行已创建：沿用原运行未来条件、目标、规则与seed':'6条路径已创建，点击开始运行');}
function stop(){if(timer)clearInterval(timer);timer=null;}
function start(fast=false){const r=run();if(!r||r.status==='complete')return;if(fast&&$('#overlay').open&&!repairTimer)$('#overlay').close();stop();U.fast=fast;r.status='running';timer=setInterval(()=>{try{E.tick(r);if(U.fast){for(const f of r.failures.filter(f=>f.status==='FAILED'))E.repair(r,f.id);}const p=pathState(r);if(U.page===4)U.cycle=Math.max(1,p.cycle);if(r.status==='complete'){stop();P.versions.find(v=>v.id===r.versionId).status='simulated';if(U.page===4)render();toast('所有路径完成；状态变化与恢复证据已保存');}else{if(U.page===4)render();if(!U.fast&&!$('#overlay').open)showPending();}}catch(e){stop();toast(e.message);}},fast?35:650);render();}
function showPending(){const f=run()?.failures.find(f=>f.status==='FAILED');if(!f){toast('没有待恢复的Gate');return;}modal(f.type+' Gate 阻断',`<dl class="kv"><dt>路径 / 周期</dt><dd>${f.pathId} / C${f.cycle}</dd><dt>节点</dt><dd>${f.node}</dd><dt>说明</dt><dd>${f.description}</dd><dt>Retry</dt><dd>${f.retry}/2</dd><dt>Checkpoint</dt><dd>${f.checkpointId}</dd></dl><div class="recovery">${Array.from({length:6},()=>'<span></span>').join('')}</div><p id="recoveryText">FAILED · 已保存失败节点输入与其他Agent输出</p>`,btn('稍后处理','close')+btn('最小回退并恢复','recover',`data-failure="${f.id}"`,true));}
function recover(id){if(repairTimer)return;const labels=['FAILED','LOCATING','MIN_ROLLBACK','REPAIRING','VALIDATING','RESUME'];let i=0;repairTimer=setInterval(()=>{const bars=$('#overlay').querySelectorAll('.recovery span');if(!bars[i]){clearInterval(repairTimer);repairTimer=null;return;}bars[i].classList.add('done');$('#recoveryText').textContent=labels[i]+' · 只处理失败节点，保留其余输出';if(++i===6){clearInterval(repairTimer);repairTimer=null;try{E.repair(run(),id);$('#overlay').close();toast('Repair成功，从Checkpoint继续；未重算其他Agent');if(!timer)start();}catch(e){$('#modalError').textContent=e.message;}}},260);}
function send(kind){const text=$('#chatInput').value.trim();if(!text)return;const ctx={runId:U.runId,path:U.path,cycle:U.cycle,plant:U.plant,version:U.version};P.messages.push({kind,role:'user',text,context:E.clone(ctx)});let answer='',evidence=null;if(kind==='goal'){U.goalText=text;U.goalDraft=E.parseGoal(text);answer=`已抽取 ${U.goalDraft.horizon}个月、遮阴${U.goalDraft.shade}%；请在结构化草稿中修订并保存，旧目标不会被覆盖。`;}else{const cy=text.match(/(?:C|第)\s*(\d+)/i),pl=text.match(/[ABCD]0[1-5]/i),pa=text.match(/(?:Path|路径)\s*([ABC][1-3])/i);if(cy)U.cycle=+cy[1];if(pl)U.plant=pl[0].toUpperCase();if(pa)U.path=pa[1].toUpperCase();else if(cy&&pl){const event=E.EVENTS.find(e=>e.cycle===U.cycle&&e.plant===U.plant);if(event)U.path=event.path;}const h=record();if(/换|替换|品种/.test(text)){answer=`“这棵树”绑定 ${U.path}/C${U.cycle}/${U.plant}。替换适应性参数可能减轻压力，但改善程度必须创建新版本后在相同未来条件下重跑；也需要核查真实适生性及成本。`;}else if(!h)answer='该运行/周期尚无证据，请先完成模拟。';else if(!h.input){const plant=h.state.find(s=>s.id===U.plant);answer=`归档结果：${U.path}/C${h.cycle}/${U.plant}健康${plant.health.toFixed(1)}，${riskLabel(plant.risk)}。完整因果证据需同条件重跑。`;}else{const before=h.input.find(x=>x.id===U.plant),after=h.state.find(x=>x.id===U.plant);answer=`${U.path}/C${h.cycle}/${U.plant}：${h.environment?D.describe(run().cards.find(c=>c.pathId===U.path).environment,h.cycle):E.PATHS.find(p=>p.id===U.path).conditions}。健康 ${before.health.toFixed(1)} → ${after.health.toFixed(1)}，结算后${riskLabel(after.risk)}。原因来自当前记录的Agent Effect与养护决策。`;evidence={runId:U.runId,path:U.path,cycle:h.cycle,plant:U.plant};}}P.messages.push({kind,role:'ai',text:answer,context:{...ctx,path:U.path,cycle:U.cycle,plant:U.plant},evidence});render();}

['认识产品：设计验证，而非预测未来',()=>route(0)],['建立项目，导入资料',()=>{E.importFiles(P);route(1);}],['发现跨文件数量冲突',()=>act('conflict')],['复核冲突，确认基线',()=>{close();E.resolveConflict(version(),3);E.confirmBaseline(P,version());route(1);}],['把业务目标结构化',()=>{U.goalDraft=E.parseGoal(E.DEFAULT_TEXT);route(2);}],['确认目标并保存版本',()=>{E.saveGoal(P,U.goalDraft||E.parseGoal(E.DEFAULT_TEXT));route(3);}],['检查六条环境路径、逐月参数与知识图谱',()=>{P.cards.forEach(E.freezeCard);route(3);}],['Agent连续模拟：Effect与统一结算',()=>{createRun();start();}],['局部异常恢复与完整运行',()=>{if($('#overlay').open)close();start(true);}],['定位C20入口风险，展开证据',()=>{U.path='B1';U.cycle=20;U.tab='risks';U.resultOpen=true;route(5);}],['追问原因与替换影响',()=>{U.chat=true;route(5);$('#chatInput').value='C20 A01为什么高风险';send('risk');$('#chatInput').value='换品种会怎样';send('risk');}],['修改方案，生成V2副本',()=>{modify();}],['确认V2并同条件重跑',()=>{close();const v=E.createVersion(P,version(),{strategy:'balanced',note:B.PRESETS.balanced.note});U.version=v.id;E.confirmBaseline(P,v);createRun();start(true);}],['比较V1与V2，保留成本取舍',()=>route(6)],['生成综合优化V3并重跑',()=>{const v=E.createVersion(P,version(),{strategy:'resilient',note:B.PRESETS.resilient.note,spacing:3,comprehensive:true});U.version=v.id;E.confirmBaseline(P,v);createRun();start(true);}],['三个版本、五维评价：同一未来下保留收益与代价',()=>{U.selected=P.versions.filter(v=>E.latestRun(P,v.id)).slice(-3).map(v=>v.id);route(6);}],['专家Trace、恢复点与回归记录',()=>{U.mode='expert';U.path='A1';U.cycle=3;U.node='Gate';route(7);act('bad');}],['记录专家决策，完成业务闭环',()=>{const r=E.latestRun(P,U.version);B.recordDecision(P,{versionId:U.version,outcome:'adopt',reviewer:'自动讲解 · 演示评审',reasons:['resilience','cost'],note:'综合比较后采纳韧性强化方案，接受额外建设投入。',risks:'极端环境仍可能产生局部风险，保留应急养护。',conditions:''});finishProject();}]

function act(a,b={}){switch(a){case 'nav':route(b.page);break;case 'next':{if(U.page===3&&P.cards.length&&P.cards.every(c=>c.frozen)){createRun();break;}const allowed=U.page===1?version().baseline.confirmed:U.page===2?P.goals.length:U.page===3?P.cards.every(c=>c.frozen):U.page===4?run()?.status==='complete':true;if(!allowed)throw Error('请完成本阶段前置条件');route(U.page+1);break;}case 'mode':U.mode=b.mode;render();break;case 'path':U.path=b.path;render();break;case 'version':stop();if(run()?.status==='running')run().status='paused';U.version=b.version;U.runId=E.latestRun(P,U.version)?.id||null;render();break;case 'tab':U.tab=b.tab;render();break;case 'cycle':U.cycle=+b.cycle;render();break;case 'result-cycle':U.cycle=+b.cycle;U.tab='map';render();break;case 'plant':U.plant=b.plant;if(U.page===1){const p=version().baseline.plants.find(x=>x.id===b.plant);modal(p.id+' · '+p.name,json(p),btn('关闭','close'));}else render();break;case 'close':close();break;
case 'new-project':modal('新建模拟项目',`${field('项目名称','projectName','华南滨水公园植物景观未来模拟')}${field('场地位置','projectLocation','华南某城市滨水区域')}${field('面积（公顷）','projectArea',3.2,'number','min="0.1" step="0.1"')}${field('气候带','projectClimate','南亚热带季风气候')}<p class="tiny">创建会重置当前演示会话。需要保留时请先导出决策摘要。</p>`,btn('取消','close')+btn('创建项目','create-project','',true));break;

case 'replay':{stop();const r=E.replay(P,run(),U.path,record().cycle);U.runId=r.id;U.page=4;render();start();break;}
case 'bad':{const h=record(),key=[U.runId,U.path,h.cycle,U.node,U.plant].join('/');if(!P.regression.some(x=>x.key===key))P.regression.push({key,runId:U.runId,pathId:U.path,cycle:h.cycle,node:U.node,plantId:U.plant,input:E.clone(h.input),effects:E.clone(h.effects),expected:'修复后Gate通过；其他节点输出与原Checkpoint一致',status:'locked'});render();toast('已加入当前会话的Locked Regression Set');break;}
case 'stat':{const titles=['项目数量','模拟运行','设计版本','风险事件','专家采纳','异常恢复'],values=[0,1,2,3].map((x,i)=>Math.round((i+1)*[1,P.runs.length,P.versions.length,P.runs.reduce((n,r)=>n+r.paths.reduce((n,p)=>n+p.history.reduce((n,h)=>n+h.events.length,0),0),0),P.adoption?1:0,P.runs.reduce((n,r)=>n+r.failures.filter(f=>f.status==='RECOVERED').length,0)][+b.index]/4));modal(titles[+b.index]+'趋势',`<p>当前会话总量。下图为演示插值快照，不代表真实历史时间统计。</p><div class="bars">${values.map((x,i)=>`<div class="bar-row"><span>快照${i+1}：${x}</span><div class="bar" style="background:var(--teal);width:${values.at(-1)?x/values.at(-1)*100:0}%"></div></div>`).join('')}</div>`,btn('关闭','close'));break;}
case 'export-summary':{const text=$('#decisionSummary').innerText,blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='PlantSim-决策摘要.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}
case 'auto':if((!U.autoIndex&&P.imports.length)||U.autoIndex>=narration.length){modal('从头自动讲解', '<p>讲解将重置当前会话，再演示完整业务闭环。默认约6分钟，可暂停或加速。</p>',btn('取消','close')+btn('重置并开始讲解','restart-auto','',true));}else toggleAuto();break;case 'restart-auto':reset();toggleAuto();break;case 'auto-speed':U.autoSpeed=U.autoSpeed===10?1:10;render();break;case 'reset':reset();break;
}}
function reset(){stop();clearInterval(autoTimer);autoTimer=null;clearInterval(repairTimer);repairTimer=null;$('#overlay').close();P=E.newProject();U={page:0,version:'V1',runId:null,path:'B1',cycle:20,plant:'A01',tab:'map',mode:'business',node:'Stress',chat:false,selected:[],goalDraft:null,goalText:E.DEFAULT_TEXT,zoom:1,panX:0,panY:0,sort:'health',auto:false,autoIndex:0,autoRemaining:20,fast:false};render();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;try{act(b.dataset.act,b.dataset);}catch(err){if($('#overlay').open&&$('#modalError'))$('#modalError').textContent=err.message;else toast(err.message);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatInput'){e.preventDefault();act('send',{kind:U.page===2?'goal':'risk'});}else if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [role="button"]')){e.preventDefault();act(e.target.dataset.act,e.target.dataset);}});
document.addEventListener('input',e=>{if(['modifySpacing','modifySpecies','modifyFull'].includes(e.target.id))updatePreview();if(e.target.id==='goalText')U.goalText=e.target.value;if(e.target.id.startsWith('task-')){const c=P.cards.find(c=>c.pathId===U.path);if(c&&!c.frozen){c.gate=null;const k=e.target.id.slice(5);c[k]=k==='horizon'?+e.target.value:e.target.value;}}});
document.addEventListener('change',e=>{try{if(e.target.id==='files'){E.importFiles(P,[...e.target.files].map(f=>f.name));render();}if(e.target.id==='resultCycle'){U.cycle=+e.target.value;render();}if(e.target.id==='traceRun'){stop();if(run()?.status==='running')run().status='paused';U.runId=e.target.value;U.version=run().versionId;render();}if(e.target.dataset.compare){const id=e.target.dataset.compare;if(e.target.checked){if(U.selected.length<3)U.selected.push(id);}else if(U.selected.length>2)U.selected=U.selected.filter(x=>x!==id);else toast('比较至少保留两个版本');render();}}catch(err){toast(err.message);}});
// Replace obsolete static dialog shells, retaining the shared visual system.
document.querySelectorAll('dialog').forEach(d=>d.remove());const overlay=document.createElement('dialog');overlay.id='overlay';overlay.addEventListener('cancel',e=>{if(repairTimer)e.preventDefault();});document.body.append(overlay);const narrationHost=document.createElement('div');narrationHost.id='narration';document.body.append(narrationHost);render();
})();
</script>
